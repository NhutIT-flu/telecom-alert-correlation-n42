# ==============================================================================
# SonarQube Project Configuration — N42 Telecom Alert Correlation
# ==============================================================================

sonar.projectKey=n42-telecom-alert
sonar.projectName=N42 Telecom Alert Correlation
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

# ------------------------------------------------------------------------------
# Source & Test Directories
# Lưu ý: Khi đặt sonar.sources=. thì bắt buộc phải đưa tests/** vào sonar.exclusions
# để tránh lỗi trùng lặp file giữa sonar.sources và sonar.tests.
# ------------------------------------------------------------------------------
sonar.sources=.
sonar.tests=tests
sonar.test.inclusions=tests/**/test_*.py,tests/**/*_test.py

# ------------------------------------------------------------------------------
# Exclusions (Loại trừ khỏi quá trình quét Source Code & Copy-Paste Detector)
# ------------------------------------------------------------------------------
sonar.exclusions=\
  tests/**,\
  **/.git/**,\
  **/.venv/**,\
  **/venv/**,\
  **/__pycache__/**,\
  **/.pytest_cache/**,\
  **/node_modules/**,\
  **/.scannerwork/**,\
  **/reports/**,\
  **/htmlcov/**,\
  **/docs/**,\
  **/n42-ai-kit/**,\
  coverage.xml

sonar.cpd.exclusions=tests/**

# Loại trừ khỏi tính toán Test Coverage (khớp với lệnh pytest --cov=app trong Jenkinsfile)
sonar.coverage.exclusions=\
  tests/**,\
  tools/**,\
  n42-ai-kit/**,\
  docker/**

# ------------------------------------------------------------------------------
# Python & Coverage Configuration
# ------------------------------------------------------------------------------
sonar.python.version=3.12
sonar.python.coverage.reportPaths=reports/coverage.xml
