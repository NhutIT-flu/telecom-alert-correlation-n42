name: N42 CI Pipeline

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-security:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest

    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: n42
          POSTGRES_USER: n42
          POSTGRES_PASSWORD: n42_local_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U n42 -d n42"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black pytest pytest-cov

      - name: Create .env file and reports directory for CI
        run: |
          mkdir -p reports
          echo 'APP_NAME=N42 Telecom Alert Correlation' > .env
          echo 'APP_ENV=testing' >> .env
          echo 'APP_HOST=127.0.0.1' >> .env
          echo 'APP_PORT=8000' >> .env
          echo 'DB_HOST=127.0.0.1' >> .env
          echo 'DB_PORT=5432' >> .env
          echo 'DB_NAME=n42' >> .env
          echo 'DB_USER=n42' >> .env

      - name: Static Code Analysis (Flake8 & Black)
        run: |
          flake8 app tests tools --count --max-line-length=120 --statistics
          black --check --line-length 120 app tests tools
          echo "✅ Static code analysis passed."

      - name: Validate N42 AI Kit Documentation
        run: |
          python n42-ai-kit/scripts/validate.py
          echo "✅ AI Kit validation passed."

      - name: Security Scan (Zero Credential Leak)
        run: |
          set -o pipefail
          python tools/check_sensitive.py . | tee reports/security-scan.txt
          echo "✅ Security scan completed."

      - name: Start FastAPI backend server & Verify Health
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn-server.log 2>&1 &
          SERVER_PID=$!
          echo "⏳ Waiting for FastAPI server to be ready..."
          MAX_RETRIES=15
          RETRY_COUNT=0
          SERVER_READY=false
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/health 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Server is responding (HTTP $HTTP_CODE)."
              curl -s http://127.0.0.1:8000/api/health > reports/health-check.json
              SERVER_READY=true
              break
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "   Attempt $RETRY_COUNT/$MAX_RETRIES — waiting 2s..."
            sleep 2
          done
          kill $SERVER_PID 2>/dev/null || true
          if [ "$SERVER_READY" != "true" ]; then
            echo "❌ Server failed to start after $MAX_RETRIES attempts. FastAPI log:"
            cat /tmp/uvicorn-server.log
            exit 1
          fi

      - name: Run Unit Tests & Coverage
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          pytest tests/ -v --junitxml=reports/junit-report.xml --cov=app --cov-report=html:reports/coverage-html --cov-report=xml:reports/coverage.xml
          echo "✅ Unit tests & coverage completed."

      - name: Upload Test Reports Artifacts
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: Complete-Test-Reports
          path: |
            reports/
            /tmp/uvicorn-server.log

