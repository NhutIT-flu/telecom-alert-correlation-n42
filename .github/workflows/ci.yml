name: N42 CI Pipeline

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  APP_ENV: testing

jobs:
  quality:
    name: Static analysis & documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-ci
        id: setup
      # Formatting policy is unchanged in this infrastructure update.
      - name: Flake8
        run: python -m flake8 app tests tools --count --max-line-length=120 --statistics 2>&1 | tee reports/flake8.txt
      - name: Black
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python -m black --check --line-length 120 app tests tools 2>&1 | tee reports/black.txt
      - name: Validate AI kit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python n42-ai-kit/scripts/validate.py 2>&1 | tee reports/ai-kit.txt
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 14
          if-no-files-found: warn

  security:
    name: Synthetic data & sensitive scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-ci
      - name: Scan checkout
        # Explicit bash uses pipefail: tee must not mask a scanner failure.
        run: python tools/check_sensitive.py . 2>&1 | tee reports/security-scan.txt
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: security-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 14
          if-no-files-found: warn

  tests:
    name: Unit tests & coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-ci
        id: setup
      # Keep the unittest command explicitly requested in N42-10.
      # Pytest also collects unittest cases plus parser function tests.
      - name: Unittest
        run: python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | tee reports/unittest.txt
      - name: Pytest & coverage
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: >-
          python -m pytest tests/ -v
          --junitxml=reports/junit-report.xml --cov=app
          --cov-report=html:reports/coverage-html --cov-report=xml:reports/coverage.xml
          2>&1 | tee reports/pytest.txt
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 14
          if-no-files-found: warn

  smoke:
    name: API health smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-ci
      # No DB service: current tests have no persistence dependency.
      - name: Start API, verify health and stop API
        timeout-minutes: 2
        run: python tools/ci_checks.py health --reports reports
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 14
          if-no-files-found: warn

  quality-and-security:
    # Preserve existing check name for later branch-protection verification.
    name: Code Quality & Automated Tests
    needs: [quality, security, tests, smoke]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require all checks to succeed
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python tools/ci_checks.py gate
