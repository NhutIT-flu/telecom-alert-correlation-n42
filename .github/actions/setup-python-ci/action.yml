name: Prepare Python CI
description: Install shared dependency pins and record the execution environment
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Install and verify dependencies
      shell: bash
      run: |
        python -m pip install -r requirements.txt
        python -m pip check
    - name: Record environment
      shell: bash
      run: python tools/ci_checks.py metadata --reports reports
